name: backend-engineering-showcase-node

services:
  postgres:
    environment:
      POSTGRES_DB: purchase_service
      POSTGRES_PASSWORD: purchase_service
      POSTGRES_USER: purchase_service
    healthcheck:
      interval: 3s
      retries: 10
      test: ['CMD-SHELL', 'pg_isready -U purchase_service']
      timeout: 3s
    image: postgres:17.6-alpine3.22
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  rabbitmq:
    healthcheck:
      interval: 3s
      retries: 10
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      timeout: 5s
    image: rabbitmq:4.1.4-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  web:
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_DATABASE: purchase_service
      DB_HOST: postgres
      DB_PASSWORD: purchase_service
      DB_PORT: "5432"
      DB_SSL: "false"
      DB_USERNAME: purchase_service
      LOG_LEVEL: info
      NODE_ENV: production
      PORT: "3000"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASSWORD: guest
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: guest
    ports:
      - "3000:3000"
